name: DeployPackages

on:
  push:
    tags:
      - '*.*.*'
      - '*.*.*-preview.*'

jobs:
  deploy-prerequisite:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Fetch all branches
        run: git fetch --all

      - name: Verify tag format and branch
        env:
          CI_COMMIT_TAG: ${{ github.ref_name }}
        run: |
          branches=$(git show --no-patch --format=%D $CI_COMMIT_TAG)
          echo "Branches: $branches"
          echo "Tag: $CI_COMMIT_TAG"
          if [[ $branches == *release* && $CI_COMMIT_TAG =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]; then
            echo "Matched Release preview tag pattern"
            exit 0
          elif [[ $branches == *main* && $CI_COMMIT_TAG =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Matched Main tag pattern"
            exit 0
          else
            echo "Created tag does not meet requirements."
            exit 1
          fi
      - name: Check for version match in version.props
        env:
          CI_COMMIT_TAG: ${{ github.ref_name }}
        run: |
          if ! grep -q "$CI_COMMIT_TAG" version.props; then
            echo "Version mismatch: $CI_COMMIT_TAG not found in version.props"
            exit 1
          fi
  deploy-abstractions:
    needs: [deploy-prerequisite]
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Pack KetPsi.Endpoints.Abstractions
        id: pack-abstraction
        uses: ./.github/workflows/actions/nuget-pack
        with:
          project_path: src/KetPsi.Endpoints.Abstractions/KetPsi.Endpoints.Abstractions.csproj
      - name: Push KetPsi.Endpoints.Abstractions
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          NUGET_SOURCE: ${{ secrets.NUGET_SOURCE }}
        uses: ./.github/workflows/actions/nuget-push
        with:
          package_path: 'pack/KetPsi.Endpoints.Abstractions.${{ github.ref_name }}.nupkg'

  wait-for-abstractions-package:
    needs: [deploy-abstractions]
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for KetPsi.Endpoints.Abstractions
        uses: ./.github/workflows/actions/nuget-wait
        with:
          package_name: KetPsi.Endpoints.Abstractions
          package_version: ${{ github.ref_name }}

  deploy-http-abstractions:
    needs: [deploy-prerequisite]
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Pack KetPsi.Endpoints.Http.Abstractions
        id: pack-abstraction
        uses: ./.github/workflows/actions/nuget-pack
        with:
          project_path: src/http/KetPsi.Endpoints.Http.Abstractions/KetPsi.Endpoints.Http.Abstractions.csproj
      - name: Push KetPsi.Endpoints.Http.Abstractions
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          NUGET_SOURCE: ${{ secrets.NUGET_SOURCE }}
        uses: ./.github/workflows/actions/nuget-push
        with:
          package_path: 'pack/KetPsi.Endpoints.Http.Abstractions.${{ github.ref_name }}.nupkg'

  wait-for-http-abstractions-package:
    needs: [deploy-http-abstractions]
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for KetPsi.Endpoints.Http.Abstractions
        uses: ./.github/workflows/actions/nuget-wait
        with:
          package_name: KetPsi.Endpoints.Http.Abstractions
          package_version: ${{ github.ref_name }}
  deploy-endpoint-http:
    needs: [wait-for-http-abstractions-package, wait-for-abstractions-package]
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Pack KetPsi.Endpoints.Http
        id: pack-http
        uses: ./.github/workflows/actions/nuget-pack
        with:
          projects_to_build_path: src/http/KetPsi.Endpoints.Http.Generator/KetPsi.Endpoints.Http.Generator.csproj
          project_path: src/http/KetPsi.Endpoints.Http/KetPsi.Endpoints.Http.csproj
      - name: Push KetPsi.Endpoints.Http
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          NUGET_SOURCE: ${{ secrets.NUGET_SOURCE }}
        uses: ./.github/workflows/actions/nuget-push
        with:
          package_path: 'pack/KetPsi.Endpoints.Http.${{ github.ref_name }}.nupkg'
