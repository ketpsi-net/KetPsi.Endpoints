name: Tests

on:
  pull_request:
    branches:
      - dev
      - main
      - release/**

jobs:
  test-prerequisite:
    runs-on: self-hosted
    outputs:
      should_run_test: ${{ steps.check-branches.outputs.should_run_test }}
    steps:
      - name: CheckBranches
        id: check-branches
        run: |
          if [[ ($GITHUB_BASE_REF == "main" && ! $GITHUB_HEAD_REF =~ release/*) ||
               ($GITHUB_BASE_REF == "dev" && $GITHUB_HEAD_REF != "main" && ! $GITHUB_HEAD_REF =~ release/*) ||
               ($GITHUB_BASE_REF =~ release/* && $GITHUB_HEAD_REF != "main" && $GITHUB_HEAD_REF != "dev") ]]; then
             echo "should_run_test=true" >> $GITHUB_OUTPUT
          else 
             echo "should_run_test=false" >> $GITHUB_OUTPUT
          fi
  tests:
    runs-on: self-hosted
    permissions: write-all
    needs: [test-prerequisite]
    if: needs.test-prerequisite.outputs.should_run_test == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Run Http tests
        run: dotnet test tests/KetPsi.Endpoints.Http.Tests/KetPsi.Endpoints.Http.Tests.csproj --collect:"XPlat Code Coverage" --results-directory ./TestResults/Http --logger:"junit;LogFilePath=test-result-http.xml;MethodFormat=Class;FailureBodyFormat=Verbose"

      - name: Run Results tests
        run: dotnet test tests/KetPsi.Endpoints.Results.Tests/KetPsi.Endpoints.Results.Tests.csproj --collect:"XPlat Code Coverage" --results-directory ./TestResults/Results --logger:"junit;LogFilePath=test-result-results.xml;MethodFormat=Class;FailureBodyFormat=Verbose"

      - name: Merge code coverage reports
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          export PATH="$PATH:/home/runner/.dotnet/tools"
          reportgenerator -reports:"./TestResults/**/*.cobertura.xml" -targetdir:"./CoverageReport" -reporttypes:"Cobertura"

      - name: Archive code coverage results
        uses: 5monkeys/cobertura-action@master
        with:
          path: CoverageReport/Cobertura.xml
          name: code-coverage-report
          minimum_coverage: 45

      - name: Archive test results
        uses: mikepenz/action-junit-report@v4
        with:
          name: test-report
          path: './TestResults/**/test-result-*.xml'